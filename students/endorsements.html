<!doctype html>
<html lang="en">
<head>

<title>Endorsements Practice · CDL English Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
:root {
  /* ---- BRAND ---------------------------------------------- */
  --tga-oxblood:    #131946; /* the wordmark ink — deepest maroon */
  --tga-maroon:     #0A3161; /* PRIMARY brand color */
  --tga-maroon-700: #14487F; /* lifted maroon — hovers, gradients */
  --tga-red:        #BA0C2F; /* hot action red — CTAs, highlights (from truck fleet numbers) */
  --tga-red-700:    #8F0A24; /* pressed red */
  --tga-amber:      #FFCB05; /* highway amber — used sparingly for accents/badges */
  --tga-navy:       #0A3161; /* patriotic / CNG diamond blue — secondary, rare */

  /* ---- NEUTRALS — "asphalt", warm-gray ------------------- */
  --tga-ink:        #1B1817; /* near-black warm — body text on light */
  --asphalt-900:    #262220;
  --asphalt-800:    #34302D;
  --asphalt-700:    #4A4541;
  --asphalt-600:    #635C57;
  --asphalt-500:    #837B74; /* muted text */
  --asphalt-400:    #A39B93;
  --asphalt-300:    #C9C2BB; /* borders, dividers */
  --asphalt-200:    #E4DFD9; /* hairlines, input borders */
  --asphalt-100:    #F0ECE7; /* subtle fills */
  --concrete:       #FAF9F5; /* default page background (off-white) */
  --white:          #FFFFFF;

  /* ---- SEMANTIC ------------------------------------------- */
  --fg-1: var(--tga-ink);        /* primary text */
  --fg-2: var(--asphalt-600);    /* secondary text */
  --fg-3: var(--asphalt-500);    /* tertiary / captions */
  --fg-on-dark:        #F7F3EE;  /* text on maroon/ink */
  --fg-on-dark-muted:  #B9C6DD;  /* muted text on maroon */

  --bg-1: var(--white);          /* cards / surfaces */
  --bg-2: var(--concrete);       /* page background */
  --bg-3: var(--asphalt-100);    /* sunken / inset */
  --bg-dark: var(--tga-oxblood); /* dark sections */

  --border-1: var(--asphalt-200);
  --border-2: var(--asphalt-300);
  --border-strong: var(--asphalt-700);

  --accent:       var(--tga-red);
  --accent-press: var(--tga-red-700);
  --link:         var(--tga-maroon);

  --success: #2E7D46;
  --warning: var(--tga-amber);
  --danger:  var(--tga-red);

  /* ---- TYPE FAMILIES ------------------------------------- */
  --font-display:   'Montserrat', Arial, sans-serif;        /* big punchy headlines */
  --font-condensed: 'Montserrat', Arial, sans-serif; /* kickers, labels, stats, signage */
  --font-body:      'Montserrat', system-ui, sans-serif;             /* body + UI */
  --font-mono:      'Montserrat', ui-monospace, monospace; /* plate numbers, codes */

  /* ---- TYPE SCALE (fluid-ish, fixed here) ---------------- */
  --fs-display:  clamp(48px, 7vw, 88px); /* @kind font */
  --fs-h1:       clamp(38px, 5vw, 60px); /* @kind font */
  --fs-h2:       clamp(30px, 3.4vw, 42px); /* @kind font */
  --fs-h3:       26px;
  --fs-h4:       21px;
  --fs-lg:       19px;
  --fs-body:     17px;
  --fs-sm:       15px;
  --fs-xs:       13px;
  --fs-kicker:   14px;

  /* ---- RADII --------------------------------------------- */
  --r-xs: 3px;
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;

  /* ---- SPACING (4pt base) -------------------------------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --sp-9: 96px; --sp-10: 128px;

  /* ---- SHADOWS — low, grounded, asphalt-tinted ----------- */
  --shadow-sm: 0 1px 2px rgba(27,24,23,.10);
  --shadow-md: 0 4px 14px rgba(27,24,23,.10);
  --shadow-lg: 0 14px 36px rgba(27,24,23,.16);
  --shadow-inset: inset 0 1px 0 rgba(255,255,255,.4);

  /* ---- MOTION -------------------------------------------- */
  --ease: cubic-bezier(.2,.7,.2,1); /* @kind other */
  --dur: 170ms; /* @kind other */
}
*{box-sizing:border-box}
body{margin:0;background:var(--concrete);color:var(--tga-ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--tga-maroon)}a:hover{color:var(--tga-red)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--tga-maroon);color:var(--fg-on-dark);position:relative;margin-bottom:6px}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:url(../assets/tread-motif.png) repeat-x center/auto 6px}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg-on-dark);font-family:var(--font-condensed);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:16px}
.logo img{height:36px;display:block}
.btn{display:inline-block;background:var(--tga-red);color:#fff;font-family:var(--font-condensed);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:16px;border:1px solid transparent;border-radius:var(--r-sm);padding:12px 22px;text-decoration:none;cursor:pointer;transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn:hover{background:var(--tga-red-700);color:#fff}.btn:active{transform:translateY(1px)}
.btn.alt{background:#fff;color:var(--tga-maroon);border-color:var(--asphalt-300)}
.btn.alt:hover{border-color:var(--tga-maroon);background:#fff;color:var(--tga-maroon)}
header .btn.alt{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
header .btn.alt:hover{background:rgba(255,255,255,.12);color:#fff;border-color:#fff}
.btn.sm{padding:7px 14px;font-size:14px}
h1,h2,h3,h4{font-family:var(--font-display);text-transform:uppercase;color:var(--tga-ink)}
h1{font-weight:900;letter-spacing:-.015em;line-height:1}
h2{font-weight:800;font-size:clamp(28px,3.4vw,38px);letter-spacing:-.01em;line-height:1.05;margin:0 0 8px}
h3{font-weight:800;font-size:22px;line-height:1.1;margin:0 0 6px}
.hero{padding:64px 0 48px;text-align:center;background:var(--white);border-bottom:1px solid var(--asphalt-200)}
.hero h1{font-size:clamp(34px,6vw,60px);margin:0 0 16px}
.hero h1 em{font-style:normal;color:var(--tga-red)}
.hero p{color:var(--asphalt-600);max-width:620px;margin:0 auto 28px;font-size:19px}
.hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sub{color:var(--asphalt-600);margin:0 0 28px}
section{padding:40px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--asphalt-200);border-top:4px solid var(--tga-maroon);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:20px;display:flex;flex-direction:column;transition:box-shadow var(--dur)}
.card:hover{box-shadow:var(--shadow-md)}
.card p{color:var(--asphalt-600);margin:0 0 16px;flex:1}
.tag,.kick{font-family:var(--font-condensed);font-weight:800;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--tga-red);margin-bottom:6px}
.plan{border-top-color:var(--tga-red);background:#fff}
.plan ul{margin:0 0 16px;padding-left:18px;color:var(--asphalt-600)}
details{margin:0 0 16px}summary{cursor:pointer;color:var(--tga-maroon);font-weight:600}details ul{margin:10px 0 0;padding-left:18px;color:var(--asphalt-600)}
footer{background:var(--tga-oxblood);color:var(--fg-on-dark-muted);padding:28px 0;font-size:14px;text-align:center;margin-top:30px}
footer a{color:#fff}
/* pre-trip page */
.sub2{color:var(--asphalt-600)}
.lets{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(26px,5vw,40px);color:var(--tga-maroon);text-align:center;margin:48px 0 0;letter-spacing:-.01em}
#groups{margin-top:40px}
.sq{background:#fff;border:1px solid var(--asphalt-200);border-top:4px solid var(--tga-maroon);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:140px;justify-content:center;align-items:center;text-align:center}
.sq h4{margin:0;font-family:var(--font-condensed);font-weight:800;font-size:22px;letter-spacing:.04em}
#groups .grid{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){#groups .grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){#groups .grid{grid-template-columns:1fr}}
#groups a.sq{text-decoration:none;color:#fff;background:var(--tga-maroon);border-color:var(--tga-maroon);border-top-color:var(--tga-red);transition:background var(--dur),transform var(--dur)}
#groups a.sq h4{color:#fff}
#groups a.sq:hover{background:var(--tga-maroon-700);transform:translateY(-2px)}
#groups a.sq small{font-family:var(--font-condensed);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-on-dark-muted);font-size:14px}
.quiz{background:#fff;border:1px solid var(--asphalt-200);border-top:4px solid var(--tga-maroon);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:24px;margin:24px 0}
.prog{font-family:var(--font-condensed);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--asphalt-500);font-size:14px;margin-bottom:8px}
.q{font-family:var(--font-display);font-weight:800;font-size:28px;text-transform:uppercase;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;color:var(--tga-ink);border:1px solid var(--asphalt-300);border-radius:var(--r-sm);padding:12px 14px;font-family:var(--font-body);font-size:17px;cursor:pointer;transition:border-color var(--dur),background var(--dur)}
.opt:hover{border-color:var(--tga-maroon);background:var(--asphalt-100)}
.opt.ok{border-color:var(--success);background:#E5F1E8}
.opt.bad{border-color:var(--tga-red);background:#E5EBFA}
.result h3{font-size:34px}
.miss{color:var(--asphalt-600);margin:8px 0 16px;padding-left:18px}

/* match truckdriversed.com */
h1,h2,h3{text-transform:none!important;letter-spacing:-.01em!important}
h1{font-weight:700!important}h2,h3{font-weight:700!important}
.lets,.q{text-transform:none!important;font-weight:700!important}
header::after{background:var(--tga-red)!important;height:4px!important;bottom:-4px!important}
.btn,.sq h4,.logo,.tag,.kick{letter-spacing:.06em!important}

.bar{height:6px;background:var(--asphalt-200);border-radius:3px;overflow:hidden;margin:0 0 20px}.bar i{display:block;height:100%;width:0;background:var(--tga-red);transition:width .3s}
.fb{margin:16px 0 0;padding:12px 14px;border-radius:var(--r-sm);font-weight:600}
.fb.ok{background:#E5F1E8;color:#1F5A32}.fb.bad{background:#FBE9EC;color:#8F0A24}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.score{font-size:48px;font-weight:800;color:var(--tga-maroon);margin:0}
.pill{display:inline-block;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.pill.pass{background:#E5F1E8;color:#1F5A32}.pill.keep{background:#FBE9EC;color:#8F0A24}
.sec{cursor:pointer;text-align:left;font:inherit;align-items:flex-start;text-align:left}
.sec:hover{box-shadow:var(--shadow-md)}.sec small{color:var(--asphalt-600);font-weight:500}
.review{padding:0;list-style:none}.review li{padding:12px 0;border-top:1px solid var(--asphalt-200)}.review b{display:block}.review .a{color:#1F5A32}.review .w{color:#8F0A24}
#sections{display:block}
.grp{padding:20px 0 4px}.grp h2{margin:0 0 4px}.grp .sub{margin:0 0 16px}
.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.g3,.grid.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid.g3,.grid.g4{grid-template-columns:1fr}}
#sections .sq h4{font-size:19px}
.grp h2,.grp>.sub{display:none}.grp{padding-top:8px}
</style>
</head>

<header><div class="wrap">

  current=order[i];answered=false;
  game.innerHTML="";
  game.appendChild(el("div","prog",name+" · Question "+(i+1)+" of "+order.length));
  var bar=el("div","bar");var fill=el("i");fill.style.width=(i/order.length*100)+"%";bar.appendChild(fill);game.appendChild(bar);
  game.appendChild(el("p","q",current.question));
  var od=el("div","opts");
  shuffle(current.choices).forEach(function(c){
    var b=el("button","opt",c);b.type="button";
    b.onclick=function(){pick(b,c,od)};
    od.appendChild(b);
  });
  game.appendChild(od);
}
function pick(btn,c,od){
  if(answered)return;answered=true;
  var right=c===current.answer;
  od.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(x.textContent===current.answer)x.classList.add("ok")});
  if(right){score++}else{btn.classList.add("bad");missed.push({q:current,chose:c})}
  game.appendChild(el("div","fb "+(right?"ok":"bad"),right?"Correct.":"Not quite. The correct answer is: "+current.answer));
  var r=el("div","row");var nb=el("button","btn",i+1>=order.length?"See results":"Next question");nb.type="button";nb.onclick=function(){i++;next()};r.appendChild(nb);game.appendChild(r);
  nb.focus();
}
function done(){
  var pct=Math.round(score/order.length*100);saveBest(name,pct);
  game.innerHTML="";
  game.appendChild(el("div","prog",name+" · Results"));
  game.appendChild(el("p","score",score+" / "+order.length+" ("+pct+"%)"));
  var passed=score/order.length>=PASS;
  game.appendChild(el("span","pill "+(passed?"pass":"keep"),passed?"Practice goal reached (80%)":"Keep practicing — goal is 80%"));
  if(missed.length){
    game.appendChild(el("h3",null,"Review these"));game.lastChild.style.marginTop="20px";
    var ul=el("ul","review");
    missed.forEach(function(m){var li=el("li");li.appendChild(el("b",null,m.q.question));li.appendChild(el("span","w","Your answer: "+m.chose));li.appendChild(document.createElement("br"));li.appendChild(el("span","a","Correct: "+m.q.answer));ul.appendChild(li)});
    game.appendChild(ul);
  }
  var r=el("div","row");
  if(missed.length){var b1=el("button","btn","Retry missed questions");b1.type="button";b1.onclick=function(){start(name,missed.map(function(m){return m.q}))};r.appendChild(b1)}
  var b2=el("button","btn alt","Restart section");b2.type="button";b2.onclick=function(){start(name,SECTIONS[name])};r.appendChild(b2);
  var b3=el("button","btn alt","All sections");b3.type="button";b3.onclick=showHome;r.appendChild(b3);
  game.appendChild(r);
}
showHome();
if(location.hash){var tg=document.getElementById(location.hash.slice(1));if(tg)tg.scrollIntoView();}
</script>
</body>
