<link rel="stylesheet" href="_ds/tga-truck-driving-school-design-system-c7194410-6592-4b6f-b699-6dfbd6f14a90/colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--concrete); color: var(--tga-ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: var(--tga-maroon); } a:hover { color: var(--tga-red); }
  three-d-stage:not(:defined) { visibility: hidden; }
  .app { display: grid; grid-template-rows: 64px minmax(0,1fr); height: 100vh; }
  header { background: var(--tga-maroon); color: var(--fg-on-dark); display: flex; align-items: center; gap: 20px; padding: 0 20px; position: relative; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px; background: url(assets/tread-motif.png) repeat-x center / auto 6px; opacity: .9; z-index: 3; }
  header img { height: 36px; display: block; }
  .htitle { display: flex; flex-direction: column; line-height: 1; gap: 4px; min-width: 0; }
  .htitle b { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .htitle span { font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--fg-on-dark-muted); }
  .spacer { flex: 1; }
  .lang { display: flex; background: rgba(0,0,0,.25); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
  .lang button { appearance: none; border: 0; background: transparent; color: var(--fg-on-dark-muted); font-family: var(--font-condensed); font-weight: 800; letter-spacing: .1em; font-size: 14px; padding: 0 14px; height: 34px; border-radius: 3px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--white); color: var(--tga-maroon); }
  main { display: grid; grid-template-columns: minmax(0,1fr) clamp(340px, 30vw, 420px); min-height: 0; }
  .viewport { position: relative; min-height: 0; overflow: hidden; }
  three-d-stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pins { position: absolute; inset: 0; pointer-events: none; }
  .pin { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid #fff; background: var(--tga-maroon); color: #fff; font-family: var(--font-condensed); font-weight: 800; font-size: 17px; display: grid; place-items: center; cursor: pointer; pointer-events: auto; box-shadow: 0 2px 6px rgba(27,24,23,.35); transition: background 170ms cubic-bezier(.2,.7,.2,1), opacity 170ms, transform 170ms; padding: 0; }
  .pin:hover { background: var(--tga-maroon-700); }
  .pin.done { background: var(--success); }
  .pin.active { background: var(--tga-red); width: 40px; height: 40px; margin: -20px 0 0 -20px; font-size: 19px; }
  .pin.active::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--tga-red); animation: ring 1.6s ease-out infinite; }
  .pin.hidden { opacity: 0; pointer-events: none; }
  .pins.stepmode .pin { display: none !important; }
  .pin.mini { width: 16px; height: 16px; margin: -8px 0 0 -8px; font-size: 0; border-width: 2px; }
  .pin.mini:hover { width: 30px; height: 30px; margin: -15px 0 0 -15px; font-size: 15px; }
  .pin .tip { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); background: var(--tga-ink); color: #fff; font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; white-space: nowrap; padding: 5px 9px; border-radius: 3px; opacity: 0; pointer-events: none; transition: opacity 170ms; }
  .pin:hover .tip, .pin.active .tip { opacity: 1; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .plabel { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; cursor: default; }
  .plabel i { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--tga-red); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(27,24,23,.4); flex: none; }
  .plabel span { margin: -5px 0 0 0; position: relative; left: 6px; background: rgba(255,255,255,.95); border: 1px solid var(--asphalt-300); color: var(--tga-ink); font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; padding: 3px 7px; border-radius: 3px; white-space: nowrap; transition: background 170ms, color 170ms; }
  .plabel.focus { z-index: 2; } .plabel.focus span { background: var(--tga-red); border-color: var(--tga-red); color: #fff; }
  ul.items li.focus label { background: #F7E9E9; }
  @keyframes ring { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
  .vbar { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center; }
  .chip { background: rgba(255,255,255,.92); border: 1px solid var(--asphalt-200); border-radius: var(--r-sm); font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--asphalt-700); padding: 0 12px; height: 36px; display: flex; align-items: center; }
  button.chip { cursor: pointer; } button.chip:hover { background: #fff; color: var(--tga-maroon); }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-condensed); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--asphalt-500); pointer-events: none; }
  aside { background: var(--white); border-left: 1px solid var(--asphalt-200); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .card { padding: 28px 28px 20px; border-bottom: 1px solid var(--asphalt-200); }
  .kicker { font-family: var(--font-condensed); font-weight: 800; text-transform: uppercase; letter-spacing: .16em; font-size: 14px; color: var(--tga-red); margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; letter-spacing: -.015em; line-height: .98; font-size: 30px; margin: 0 0 8px; text-wrap: balance; }
  .area { font-family: var(--font-condensed); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--asphalt-500); margin: 0 0 18px; }
  .lead { font-size: 17px; line-height: 1.5; color: var(--asphalt-700); margin: 0 0 22px; text-wrap: pretty; }
  ul.items { list-style: none; margin: 0 0 22px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  ul.items li label { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 12px; padding: 10px 10px 10px 8px; border-radius: var(--r-sm); cursor: pointer; transition: background 170ms; }
  ul.items li label:hover { background: var(--asphalt-100); }
  ul.items input { appearance: none; width: 22px; height: 22px; margin: 1px 0 0; border: 2px solid var(--asphalt-300); border-radius: 4px; display: grid; place-items: center; cursor: pointer; background: #fff; }
  ul.items input:checked { background: var(--success); border-color: var(--success); }
  ul.items input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .it b { display: block; font-weight: 700; font-size: 16px; line-height: 1.25; margin-bottom: 2px; }
  .it span { font-size: 15px; line-height: 1.45; color: var(--asphalt-600); text-wrap: pretty; }
  input:checked + .it b { color: var(--asphalt-500); }
  .nav { display: flex; gap: 10px; align-items: center; }
  .btn { appearance: none; border: 1px solid transparent; border-radius: var(--r-sm); height: 46px; padding: 0 20px; font-family: var(--font-condensed); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 170ms cubic-bezier(.2,.7,.2,1), transform 170ms; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--tga-red); color: #fff; } .btn.primary:hover { background: var(--tga-red-700); }
  .btn.outline { background: #fff; color: var(--tga-maroon); border-color: var(--asphalt-300); } .btn.outline:hover { border-color: var(--tga-maroon); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn.grow { flex: 1; justify-content: center; }
  .progress { height: 4px; background: var(--asphalt-100); border-radius: 2px; overflow: hidden; margin: 0 0 20px; }
  .progress i { display: block; height: 100%; background: var(--tga-red); transition: width 300ms cubic-bezier(.2,.7,.2,1); }
  .steps { flex: 1; padding: 14px 16px 10px; }
  .steps h2 { font-family: var(--font-condensed); font-weight: 800; text-transform: uppercase; letter-spacing: .16em; font-size: 13px; color: var(--asphalt-500); margin: 4px 12px 8px; display: flex; justify-content: space-between; }
  .srow { appearance: none; width: 100%; border: 0; background: transparent; display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 8px 12px; border-radius: var(--r-sm); cursor: pointer; font-family: var(--font-body); color: var(--tga-ink); min-height: 44px; }
  .srow:hover { background: var(--asphalt-100); }
  .srow.active { background: #F7E9E9; }
  .srow .n { width: 28px; height: 28px; border-radius: 50%; background: var(--asphalt-100); border: 1px solid var(--asphalt-300); display: grid; place-items: center; font-family: var(--font-condensed); font-weight: 800; font-size: 15px; color: var(--asphalt-700); }
  .srow.active .n { background: var(--tga-red); border-color: var(--tga-red); color: #fff; }
  .srow.done .n { background: var(--success); border-color: var(--success); color: #fff; }
  .srow .t { font-weight: 600; font-size: 15px; }
  .srow .c { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--asphalt-500); }
  .foot { padding: 12px 28px 14px; border-top: 1px solid var(--asphalt-200); font-size: 13px; color: var(--asphalt-500); display: flex; justify-content: space-between; gap: 12px; }
  .foot button { appearance: none; border: 0; background: none; color: var(--tga-maroon); font: inherit; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 900px) {
    .app { height: auto; min-height: 100vh; }
    main { grid-template-columns: 1fr; }
    .viewport { height: 58vh; }
    aside { border-left: 0; border-top: 1px solid var(--asphalt-200); }
    .card { max-height: none; }
    .htitle span { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="assets/tga-logo-white.png" alt="TGA Truck Driving School">
    <div class="htitle"><b data-i18n="title">Pre-Trip Inspection</b><span data-i18n="subtitle">3D Walkaround · Class A Tractor</span></div>
    <div class="spacer"></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="es" aria-pressed="false">ES</button>
    </div>
  </header>
  <main>
    <div class="viewport" id="viewport">
      <div class="loading" id="loading" data-i18n="loading">Loading truck…</div>
      <three-d-stage name="tga-pretrip-tractor" background="#E9E4DC"></three-d-stage>
      <div class="pins" id="pins"></div>
      <div class="vbar">
        <button class="chip" id="overviewBtn" data-i18n="overview">Overview</button>
        <span class="chip" data-i18n="hint">Drag to rotate · Scroll to zoom</span>
      </div>
    </div>
    <aside>
      <div class="card" id="card"></div>
      <div class="steps">
        <h2><span data-i18n="stops">Inspection stops</span><span id="total"></span></h2>
        <div id="steplist"></div>
      </div>
      <div class="foot"><span data-i18n="disclaimer">Study aid — always follow the current CA CDL Handbook.</span><button id="resetBtn" data-i18n="reset">Reset</button></div>
    </aside>
  </main>
</div>
<script src="three-d-stage.js"></script>
<script type="module" src="inspection.js"></script>
</body>
</html>
