<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Trip Inspection · CDL English Academy</title>
<style>
:root{--bg:#0f1715;--panel:#16211e;--line:#2a3a35;--text:#e8f1ee;--mute:#9db1aa;--green:#2fbf85;--gold:#f0b429;--red:#e5604d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none}
.logo b{border:2px solid var(--green);color:var(--green);border-radius:6px;padding:2px 8px;font-size:15px}
.btn{display:inline-block;background:var(--green);color:#06130e;font-weight:700;border:0;border-radius:8px;padding:11px 18px;text-decoration:none;cursor:pointer;font-size:16px}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
h1{font-size:clamp(28px,5vw,40px);margin:36px 0 8px}
h2{font-size:24px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px}
section{padding:24px 0}
.group{margin-bottom:28px}
.group h3{color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:90px;justify-content:center}
.sq h4{margin:0;font-size:18px}
.es{color:var(--green);font-size:15px}
.chk{color:var(--mute);font-size:14px;flex:1}
.say{font-size:13px;color:var(--text);border-left:3px solid var(--gold);padding-left:8px}
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.q{font-size:20px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt.ok{border-color:var(--green);background:#143026}
.opt.bad{border-color:var(--red);background:#35201c}
.prog{color:var(--mute);font-size:14px;margin-bottom:8px}
.result h3{font-size:28px;margin:0 0 8px}
.miss{color:var(--mute);margin:12px 0 16px;padding-left:18px}
.lets{font-size:clamp(26px,5vw,38px);font-weight:700;color:var(--green);text-align:center;margin:56px 0 0}
#groups{margin-top:48px}
#groups .grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
#groups .sq{min-height:140px;align-items:center;text-align:center}
#groups .sq h4{font-size:22px}
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:24px 0}.q{font-size:26px;font-weight:700;margin:0 0 14px}.opts{display:grid;gap:10px}.opt{text-align:left;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:17px;cursor:pointer}.opt:hover{border-color:var(--green)}.opt.ok{border-color:var(--green);background:#143026}.opt.bad{border-color:var(--red);background:#35201c}.prog{color:var(--mute);font-size:14px;margin-bottom:8px}.result h3{font-size:32px;margin:0 0 8px}.miss{color:var(--mute);margin:8px 0 16px;padding-left:18px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:14px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="./"><b>CDL</b> English Academy</a>
  <a class="btn alt sm" href="./#lessons">All lessons</a>
</div></header>

<main class="wrap">
  <h1>Pre-Trip Inspection</h1>
  <p class="lets">Let's see what you know?</p>
  <div id="groups"></div>
  <div style="text-align:center;margin:32px 0"><button class="btn" id="start" style="font-size:20px;padding:14px 36px">Get started</button></div>
  <div class="quiz" id="game" style="display:none"></div>

</main>

<footer><div class="wrap">TGA Truck Driving School &middot; <a href="mailto:caroline@tgatruckschool.com">caroline@tgatruckschool.com</a></div></footer>

<script>
var NAMES=["Engine compartment","In the cab","Lights and signals","Wheels, brakes, and suspension","Coupling and trailer"];
var grid=document.createElement("div");grid.className="grid";
NAMES.forEach(function(n){var s=document.createElement("div");s.className="sq";var h=document.createElement("h4");h.textContent=n;s.appendChild(h);grid.appendChild(s);});
document.getElementById("groups").appendChild(grid);

var PARTS=[["Dipstick / oil level", "varilla del aceite"], ["Coolant", "refrigerante"], ["Power steering fluid", "líquido de la dirección"], ["Belts", "bandas / correas"], ["Hoses", "mangueras"], ["Air compressor", "compresor de aire"], ["Battery", "batería"], ["Steering wheel", "volante"], ["Gauges", "indicadores"], ["Mirrors", "espejos"], ["Horn", "bocina"], ["Windshield wipers", "limpiaparabrisas"], ["Seat belt", "cinturón de seguridad"], ["Emergency equipment", "equipo de emergencia"], ["Headlights", "faros"], ["Turn signals", "direccionales"], ["Brake lights", "luces de freno"], ["Hazard lights", "luces de emergencia"], ["Reflectors", "reflectores"], ["Tires", "llantas"], ["Rims", "rines"], ["Lug nuts", "tuercas de rueda"], ["Hub seal", "sello del cubo"], ["Brake drum", "tambor de freno"], ["Slack adjuster", "ajustador de holgura"], ["Springs and shock absorbers", "resortes y amortiguadores"], ["Air lines", "mangueras de aire"], ["Fifth wheel", "quinta rueda"], ["Kingpin", "perno rey"], ["Landing gear", "patas de apoyo"], ["Mud flaps", "guardafangos"], ["Cargo doors", "puertas de carga"], ["Fuel tank", "tanque de combustible"]];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var game=document.getElementById("game"),startBtn=document.getElementById("start"),order,i,score,missed;
startBtn.onclick=begin;
function begin(){order=shuffle(PARTS);i=0;score=0;missed=[];startBtn.parentNode.style.display="none";document.getElementById("groups").style.display="none";game.style.display="block";next();}
function next(){
  if(i>=order.length)return done();
  var q=order[i];
  var opts=shuffle([q].concat(shuffle(PARTS.filter(function(x){return x!==q})).slice(0,3)));
  game.innerHTML='<div class="prog"></div><p class="q"></p><div class="opts"></div>';
  game.querySelector(".prog").textContent="Part "+(i+1)+" of "+order.length;
  game.querySelector(".q").textContent=q[0];
  var od=game.querySelector(".opts");
  opts.forEach(function(o){
    var b=document.createElement("button");b.className="opt";b.textContent=o[1];
    b.onclick=function(){
      od.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(x.textContent===q[1])x.classList.add("ok")});
      if(o===q){score++}else{b.classList.add("bad");missed.push(q)}
      setTimeout(function(){i++;next()},900);
    };
    od.appendChild(b);
  });
}
function done(){
  game.innerHTML='<div class="result"><h3></h3><div class="mw"></div><button class="btn">Play again</button></div>';
  game.querySelector("h3").textContent=score+" / "+order.length;
  if(missed.length){
    var l=document.createElement("div");l.textContent="Review these:";
    var ul=document.createElement("ul");ul.className="miss";
    missed.forEach(function(m){var li=document.createElement("li");li.textContent=m[0]+" = "+m[1];ul.appendChild(li)});
    game.querySelector(".mw").appendChild(l);game.querySelector(".mw").appendChild(ul);
  }
  game.querySelector(".btn").onclick=begin;
}
</script>
</body>
</html>
