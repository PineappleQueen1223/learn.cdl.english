<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Learn commercial driver (CDL) English: vocabulary, pre-trip inspection, road test phrases, and workplace English for ESL students.">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CDL English Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: highway-sign header over a single working column; term picture on the right at wide widths, stacked on phones. */
:root{
  --bg:#eef1ef; --panel:#ffffff; --panel2:#e2e9e5; --ink:#14201b; --muted:#4f5f58; --line:#c6d1cb;
  --green:#0b6b47; --green-ink:#ffffff; --yellow:#f5b800; --yellow-ink:#1a1500;
  --ok:#11794a; --okbg:#dff3e8; --bad:#b3261e; --badbg:#fbe4e1;
  --truckbody:#0b6b47; --trailer:#dde5e1; --tire:#1d2623; --glass:#bfe0ec;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Noto Sans","Noto Sans Armenian","Noto Sans KR","Noto Sans SC","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101618; --panel:#182124; --panel2:#212d31; --ink:#e8efec; --muted:#a2b5ad; --line:#304148;
  --green:#3cc58c; --green-ink:#06180f; --yellow:#f5c230; --yellow-ink:#1a1500;
  --ok:#5fdc9f; --okbg:#173326; --bad:#ff9a90; --badbg:#3a1d1a;
  --truckbody:#2f9c70; --trailer:#2a373b; --tire:#0a0f10; --glass:#31515c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101618; --panel:#182124; --panel2:#212d31; --ink:#e8efec; --muted:#a2b5ad; --line:#304148;
  --green:#3cc58c; --green-ink:#06180f; --yellow:#f5c230; --yellow-ink:#1a1500;
  --ok:#5fdc9f; --okbg:#173326; --bad:#ff9a90; --badbg:#3a1d1a;
  --truckbody:#2f9c70; --trailer:#2a373b; --tire:#0a0f10; --glass:#31515c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px 12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.sign{background:var(--green);color:var(--green-ink);border:3px solid var(--green-ink);box-shadow:0 0 0 2px var(--green);border-radius:6px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.06em;line-height:1.1}
.brand h1{font-size:1.5rem}
.brand p{color:var(--muted);font-size:.9rem}
.langbox{display:flex;align-items:center;gap:8px}
.langbox label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
.nav{display:flex;gap:4px;overflow-x:auto;max-width:1080px;margin:0 auto;scrollbar-width:thin}
.nav button{flex:0 0 auto;background:none;border:0;border-bottom:4px solid transparent;padding:12px 14px 8px;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.03em;color:var(--muted);white-space:nowrap;min-height:48px}
.nav button small{display:block;font-family:var(--body);font-weight:500;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--yellow)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding-block:14px;color:var(--muted);font-size:.92rem}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:140px;flex:1 1 140px;max-width:260px}
.bar i{display:block;height:100%;background:var(--green)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.sub{display:flex;flex-wrap:wrap;gap:8px;margin-block:4px 16px}
.pill{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;min-height:40px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn{background:var(--green);color:var(--green-ink);border:0;border-radius:6px;padding:10px 18px;min-height:44px;font-weight:600}
.btn.alt{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--yellow);color:var(--yellow-ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px;align-items:start}
.layout>.side{position:sticky;top:76px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.layout>.side{position:static;order:-1}}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);min-height:46px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-height:64px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.tile b{font-weight:600;overflow-wrap:anywhere;padding-right:16px}
.tile span{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.tile[aria-pressed="true"]{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.tile .ck{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.card .pic{background:var(--panel2);padding:10px;border-bottom:1.5px solid var(--line)}
.card .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:2.1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;display:block}
.tr{background:var(--panel2);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.trtext{font-size:1.5rem;font-weight:600;overflow-wrap:anywhere}
.ex{border-left:4px solid var(--yellow);padding-left:12px}
mark{background:var(--yellow);color:var(--yellow-ink);padding:0 3px;border-radius:2px}
.icon{height:170px;display:grid;place-items:center;color:var(--green)}
.icon svg{height:120px;width:120px}
.truck{width:100%;height:auto;display:block}
.truck .ln{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.truck .gnd{stroke:var(--muted);stroke-width:2}
.truck .trl{fill:var(--trailer)}.truck .cab{fill:var(--truckbody)}.truck .gls{fill:var(--glass)}
.truck .tire{fill:var(--tire)}.truck .hub{fill:var(--panel2)}
.truck .dot{fill:var(--yellow);stroke:var(--ink);stroke-width:2;cursor:pointer}
.truck .dot.sel{stroke-width:3}
.truck .ring{fill:none;stroke:var(--yellow);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
.truck .tag rect{fill:var(--ink)}.truck .tag text{fill:var(--bg);font-family:var(--body);font-weight:600;font-size:15px}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.truck .ring{animation:none}}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.zone{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-height:58px}
.zone b{display:block;font-family:var(--display);font-size:1.15rem}
.zone span{font-size:.82rem;color:var(--muted)}
.zone[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.zone[aria-pressed="true"] span{color:var(--green-ink)}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.6rem;margin-bottom:6px}
.lead{color:var(--muted);max-width:65ch;margin-bottom:14px}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cmd{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cmd q{font-family:var(--display);font-size:1.45rem;font-weight:700;quotes:none;line-height:1.15}
.cmd p{color:var(--muted);font-size:.92rem}
.chat{display:flex;flex-direction:column;gap:10px;margin-block:12px}
.msg{max-width:min(520px,92%);padding:10px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel)}
.msg.d{align-self:flex-start}.msg.r{align-self:flex-end;background:var(--panel2)}
.msg .who{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:center}
.hl{background:none;border:0;border-bottom:2px solid var(--yellow);padding:0;font-weight:600;color:inherit}
.q h2{font-size:1.5rem;margin-block:8px 12px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-block:12px}
.opt{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;min-height:52px;display:flex;gap:12px;align-items:baseline}
.opt kbd{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:6px;margin-block:8px;background:var(--panel2)}
.score{font-family:var(--display);font-size:4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.flash{max-width:520px;margin-inline:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.badge{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:14px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.badge .seal{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);color:var(--muted)}
.badge.on .seal{background:var(--yellow);border-color:var(--ink);color:var(--yellow-ink)}
.badge svg{width:30px;height:30px}
.badge h3{font-size:1.25rem}
.badge p{font-size:.88rem;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-block:8px}
.key{padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.9rem}
.key.ok{background:var(--okbg);border-color:var(--ok)}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel)}
.shadow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-top:1.5px solid var(--line)}
.shadow p{flex:1 1 220px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:6px;font-weight:600;z-index:20;max-width:92vw;text-align:center}
.small{font-size:.88rem;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="sign" aria-hidden="true">CDL</div>
      <div><h1>CDL English Academy</h1><p>Learn the language of commercial driving.</p></div>
    </div>
    <div class="langbox"><label for="lang">My language</label><select id="lang"></select></div>
  </header>
  <div class="navbar"><nav class="nav" id="nav" aria-label="Levels"></nav></div>
  <div class="stats" id="stats"></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var h=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var LANGS=[["es","Español"],["hy","Հայերեն"],["ru","Русский"],["vi","Tiếng Việt"],["ko","한국어"],["zh","中文"],["en","English only"]];
var LN={es:"Spanish",hy:"Armenian",ru:"Russian",vi:"Vietnamese",ko:"Korean",zh:"Chinese"};
var ZONES=[
 {id:"engine",name:"Engine compartment",blurb:"Oil, coolant, belts"},
 {id:"steering",name:"Steering components",blurb:"Wheel, box, tie rods"},
 {id:"suspension",name:"Suspension",blurb:"Springs and shocks"},
 {id:"brakes",name:"Brake system",blurb:"Air brakes and parts"},
 {id:"tires",name:"Tires and wheels",blurb:"Tread, sidewalls, lugs"},
 {id:"coupling",name:"Coupling system",blurb:"Fifth wheel and kingpin"}];
var CATS=[["all","All terms"],["truck","Truck parts"],["paper","Paperwork"],["drive","Driving and safety"],["work","Work and dispatch"],["parts","Pre-trip parts"]];

/* ---------- term data: T(id, English, level, details, [es,hy,ru,vi,ko,zh]) ---------- */
var TERMS=[];
function T(id,en,lv,o,tr){TERMS.push(Object.assign({id:id,en:en,lv:lv,tr:{es:tr[0],hy:tr[1],ru:tr[2],vi:tr[3],ko:tr[4],zh:tr[5]}},o))}
T("tractor","Tractor",1,{cat:"truck",at:[520,100],def:"The front part of the truck. It has the engine and pulls the trailer.",ex:"The tractor pulled the trailer onto the highway."},["tractocamión","քարշակ","тягач","đầu kéo","트랙터","牵引车"]);
T("trailer","Trailer",1,{cat:"truck",at:[220,100],def:"The part behind the tractor that carries the cargo.",ex:"We loaded the boxes into the trailer."},["remolque","կցասայլ","прицеп","rơ moóc","트레일러","挂车"]);
T("cab","Cab",1,{cat:"truck",at:[515,90],def:"The part of the truck where the driver sits.",ex:"The driver climbed into the cab."},["cabina","խցիկ","кабина","ca-bin","운전석(캡)","驾驶室"]);
T("fifth-wheel","Fifth wheel",1,{cat:"truck",zone:"coupling",at:[462,164],def:"A flat plate on the tractor. It holds the trailer's kingpin and locks the trailer in place.",ex:"Check that the fifth wheel is locked before you drive."},["quinta rueda","հինգերորդ անիվ (կցորդման սարք)","седельно-сцепное устройство","bàn đỡ rơ moóc (fifth wheel)","피프스 휠(연결 장치)","牵引鞍座(第五轮)"]);
T("kingpin","Kingpin",1,{cat:"truck",zone:"coupling",at:[432,176],def:"A strong steel pin under the front of the trailer. It locks into the fifth wheel.",ex:"The jaws closed around the kingpin."},["perno rey","կինգպին (կցորդման գամ)","шкворень","chốt kéo","킹핀","牵引销"]);
T("air-brakes","Air brakes",1,{cat:"truck",zone:"brakes",at:[545,195],def:"A braking system that uses compressed air to stop a commercial vehicle.",ex:"The driver checked the air brakes before leaving the yard."},["frenos de aire","օդային արգելակներ","пневматические тормоза","phanh hơi","공기 브레이크","气刹(空气制动)"]);
T("mirror","Mirror",1,{cat:"truck",at:[588,70],def:"A glass on the side of the truck. It lets you see behind and beside the truck.",ex:"Check your mirrors before you change lanes."},["espejo","հայելի","зеркало","gương","거울","后视镜"]);
T("horn","Horn",1,{cat:"truck",at:[570,150],def:"A device that makes a loud sound to warn other people.",ex:"Sound your horn before you back up."},["claxon (bocina)","ազդանշան (կլաքսոն)","гудок","còi","경적","喇叭"]);
T("cargo","Cargo",1,{cat:"truck",at:[200,100],def:"The goods that the truck carries.",ex:"The cargo was fresh fruit."},["carga","բեռ","груз","hàng hóa","화물","货物"]);
T("logbook","Logbook",1,{cat:"paper",icon:"doc",def:"A record of your driving hours and rest time.",ex:"Write the time in your logbook."},["bitácora (registro de horas)","վարորդի օրագիր","журнал учёта рабочего времени","sổ nhật ký lái xe","운행 일지","行车日志"]);
T("bill-of-lading","Bill of lading",1,{cat:"paper",icon:"doc",def:"A paper that lists the cargo, the shipper, and the receiver.",ex:"The shipper gave the driver the bill of lading."},["conocimiento de embarque (carta de porte)","բեռնագիր","товарно-транспортная накладная","vận đơn","선하증권(운송장)","提单(运单)"]);
T("endorsement","Endorsement",1,{cat:"paper",icon:"badge",def:"An extra permission on your CDL, for example for tank vehicles or hazardous materials.",ex:"He added a tanker endorsement to his CDL."},["endoso","վարորդական իրավունքի հավելում","допуск (отметка в правах)","chứng nhận bổ sung","면허 추가 자격","驾照加注"]);
T("pre-trip-inspection","Pre-trip inspection",1,{cat:"drive",icon:"check",def:"A safety check of the truck that you do before you drive.",ex:"The driver did a pre-trip inspection at 5 AM."},["inspección previa al viaje","երթից առաջ զննում","предрейсовый осмотр","kiểm tra trước chuyến đi","운행 전 점검","行前检查"]);
T("blind-spot","Blind spot",1,{cat:"drive",at:[300,120],def:"An area around the truck that you cannot see in your mirrors.",ex:"A car was in the truck's blind spot."},["punto ciego","կույր գոտի","слепая зона","điểm mù","사각지대","盲区"]);
T("backing","Backing",1,{cat:"drive",icon:"back",def:"Driving the truck in reverse.",ex:"Backing a trailer takes practice."},["retroceso (maniobra en reversa)","հետընթաց","движение задним ходом","lùi xe","후진","倒车"]);
T("jackknife","Jackknife",1,{cat:"drive",icon:"jack",def:"When the trailer swings out and folds toward the tractor, like a knife blade.",ex:"Hard braking on ice can cause a jackknife."},["plegado del tráiler (jackknife)","ծալվել (ջեքնայֆ)","складывание автопоезда","gập xe (jackknife)","잭나이프 현상","折叠事故(甩尾折叠)"]);
T("gross-vehicle-weight","Gross vehicle weight",1,{cat:"drive",icon:"scale",def:"The total weight of a vehicle with its cargo.",ex:"Check the gross vehicle weight before you cross the bridge."},["peso bruto del vehículo","մեքենայի ընդհանուր քաշ","полная масса транспортного средства","tổng trọng lượng xe","차량 총중량","车辆总重量"]);
T("dispatcher","Dispatcher",1,{cat:"work",icon:"headset",def:"The person who gives drivers their pickup and delivery jobs.",ex:"The dispatcher called with a new load."},["despachador","դիսպետչեր","диспетчер","điều phối viên","배차 담당자","调度员"]);
T("yard","Yard",1,{cat:"work",icon:"lot",def:"An area where trucks and trailers park and wait.",ex:"The truck waited in the yard."},["patio de camiones","բակ (կայանման հրապարակ)","площадка (двор)","bãi xe","야적장","货场"]);
T("weigh-station","Weigh station",1,{cat:"work",icon:"scale",def:"A stop on the highway where trucks are weighed and checked.",ex:"All trucks must stop at the weigh station when it is open."},["estación de pesaje","կշռման կետ","пункт взвешивания","trạm cân","계량소","称重站"]);
T("shipper","Shipper",4,{cat:"work",icon:"ship",def:"The company that sends the cargo.",ex:"Report to the shipper by 6:45 AM."},["remitente (expedidor)","ուղարկող","грузоотправитель","người gửi hàng","송하인(화주)","发货人"]);
T("receiver","Receiver",4,{cat:"work",icon:"recv",def:"The company or person that gets the cargo.",ex:"The receiver signed for the load."},["destinatario","ստացող","грузополучатель","người nhận hàng","수하인","收货人"]);

  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||0.95;
   var v=speechSynthesis.getVoices().filter(function(x){return /^en[-_]US/i.test(x.lang)})[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast("Audio is not available in this browser.")}}

function viewBrowse(){
  var list=TERMS.filter(termMatch);
  var cats='<div class="sub" role="group" aria-label="Category">'+CATS.map(function(c){return '<button class="pill" data-act="cat" data-cat="'+c[0]+'" aria-pressed="'+(S.cat===c[0])+'">'+c[1]+'</button>'}).join("")+'</div>';
  var grid=list.length?'<div class="grid">'+list.map(function(t){return '<button class="tile" data-act="pick" data-id="'+t.id+'" aria-pressed="'+(S.sel===t.id)+'"><b>'+h(t.en)+'</b>'+(S.lang!=="en"?'<span lang="'+S.lang+'">'+h(t.tr[S.lang])+'</span>':'')+(P.learned[t.id]?'<i class="ck" title="Learned"></i>':'')+'</button>'}).join("")+'</div>':'<p class="lead">No term matches “'+h(S.q)+'”. Try another word.</p>';
  var t=BYID[S.sel]||TERMS[0];
  return '<div class="layout"><section><label for="q" class="lbl">Look up a term (English'+(S.lang!=="en"?" or "+LN[S.lang]:"")+')</label><input id="q" class="search" type="search" placeholder="What is a kingpin?" value="'+h(S.q)+'" autocomplete="off">'+cats+grid+'</section><aside class="side">'+detail(t)+'</aside></div>'}
function deckIds(){var d=S.deck;return TERMS.filter(function(t){return d==="all"||(d==="basics"&&t.lv===1)||(d==="pretrip"&&t.lv===2)||(d==="air"&&t.zone==="brakes")||(d==="work"&&(t.lv===4||t.cat==="work"))}).map(function(t){return t.id})}
function initFlash(){var ids=shuffle(deckIds());S.flash={queue:ids,total:ids.length,flipped:false,known:0}}
function viewFlash(){
  if(!S.flash)initFlash();
  var F=S.flash,decks=[["all","All terms"],["basics","Basics"],["pretrip","Pre-trip parts"],["air","Air brakes"],["work","Workplace"]];
  var dk='<div class="sub" role="group" aria-label="Deck">'+decks.map(function(d){return '<button class="pill" data-act="deck" data-deck="'+d[0]+'" aria-pressed="'+(S.deck===d[0])+'">'+d[1]+'</button>'}).join("")+'</div>';
  if(!F.queue.length)return dk+'<div class="panel flash"><h2>Deck complete</h2><p class="lead">You marked '+F.known+' of '+F.total+' terms as known.</p><button class="btn" data-act="deck" data-deck="'+S.deck+'">Shuffle and start again</button></div>';
  var t=BYID[F.queue[0]];
  var front='<div class="card"><div class="pic">'+pic(t)+'</div><div class="body"><h2>'+h(t.en)+'</h2><div class="row">'+say(t.en,0.9,"Listen")+'</div>'+(F.flipped?'':'<button class="btn" data-act="flip">Show meaning</button>')+'</div></div>';
  var back=F.flipped?'<div class="panel" style="margin-top:12px"><span class="lbl">Meaning</span><p>'+h(t.def)+'</p>'+(S.lang!=="en"?'<div class="tr" style="margin-top:10px"><span class="lbl">'+LN[S.lang]+'</span><span class="trtext" lang="'+S.lang+'">'+h(t.tr[S.lang])+'</span></div>':'')+'<div class="ex" style="margin-top:10px"><p>'+hiliEx(t)+'</p></div><div class="row" style="margin-top:14px"><button class="btn warn" data-act="again">Still learning</button><button class="btn" data-act="know">I know it</button></div></div>':'';
  return dk+'<div class="flash"><p class="small" style="margin-bottom:8px">'+(F.total-F.queue.length+1)+' of '+F.total+' in this round · '+F.queue.length+' left</p>'+front+back+'</div>'}

function viewPre(){
  var zt=TERMS.filter(function(t){return t.zone===S.zone});
  if(!S.pre||!BYID[S.pre]||BYID[S.pre].zone!==S.zone)S.pre=zt[0].id;
  var z=ZONES.filter(function(x){return x.id===S.zone})[0];
  var zb='<div class="zones" role="group" aria-label="Truck system">'+ZONES.map(function(x){var n=TERMS.filter(function(t){return t.zone===x.id});var k=n.filter(function(t){return P.learned[t.id]}).length;return '<button class="zone" data-act="zone" data-zone="'+x.id+'" aria-pressed="'+(S.zone===x.id)+'"><b>'+x.name+'</b><span>'+k+' of '+n.length+' learned</span></button>'}).join("")+'</div>';
  var t=BYID[S.pre];
  return head("Pre-trip inspection vocabulary","Pick a system, then tap a yellow dot on the truck or a name in the list. In the skills test you must name each part and say what you check.")+zb+
   '<div class="layout"><section><div class="panel" style="padding:10px">'+truck(zt,S.pre,true)+'</div>'+
   '<div class="sub" role="group" aria-label="'+z.name+' parts">'+zt.map(function(x){return '<button class="pill" data-act="pick" data-id="'+x.id+'" aria-pressed="'+(S.pre===x.id)+'">'+h(x.en)+'</button>'}).join("")+'</div>'+
   '<div class="row"><button class="btn" data-act="quizstart" data-key="zone-'+S.zone+'">Quiz: '+z.name+'</button><button class="btn alt" data-act="quizstart" data-key="pretrip">Pre-trip final quiz</button></div></section><aside class="side">'+detail(t)+'</aside></div>'}

function viewRoad(){
  return head("DMV skills test English","These are phrases an examiner may say during the CDL skills test. Listen, learn the meaning, then take the quiz. Examiners may use other words, so ask politely if you do not understand.")+
   '<div class="row" style="margin-bottom:14px"><button class="btn" data-act="quizstart" data-key="road">Quiz: What does it mean?</button></div>'+
   '<div class="cmds">'+COMMANDS.map(function(c){return '<div class="cmd"><q>'+h(c[0])+'</q><p>'+h(c[1])+'</p><p><b>Remember:</b> '+h(c[5])+'</p><div class="row">'+say(c[0],0.9,"Listen")+say(c[0],0.55,"Slow")+'</div></div>'}).join("")+'</div>'}

function linkTerms(txt){
  var re=/\b(shipper|receiver|route|appointment|detention|load|logbook|dispatcher|bill of lading|yard)(s?)\b/gi;
  return h(txt).replace(re,function(m,a,b){var id=a.toLowerCase().replace(/ /g,"-");return '<button class="hl" data-act="wpick" data-id="'+id+'">'+a+b+'</button>'})}
function viewWork(){
  var d=DIALOGS[S.dlg];
  var tabs='<div class="sub" role="group" aria-label="Conversation">'+DIALOGS.map(function(x,i){return '<button class="pill" data-act="dlg" data-i="'+i+'" aria-pressed="'+(S.dlg===i)+'">'+x.title+'</button>'}).join("")+'</div>';
  var chat='<div class="chat">'+d.lines.map(function(l){var dr=l[0]==="Driver";return '<div class="msg '+(dr?'r':'d')+'"><div class="who"><span>'+l[0]+'</span><button class="btn alt small" data-act="say" data-say="'+h(l[1])+'" data-rate="0.9">Listen</button></div><p>'+linkTerms(l[1])+'</p></div>'}).join("")+'</div>';
  var chips=TERMS.filter(function(t){return t.lv===4}).map(function(t){return '<button class="pill" data-act="wpick" data-id="'+t.id+'" aria-pressed="'+(S.wterm===t.id)+'">'+h(t.en)+'</button>'}).join("");
  return head("Workplace English","Real conversations between drivers, dispatchers, and receivers. Tap an underlined word to see its meaning.")+tabs+
   '<div class="layout"><section>'+chat+'<span class="lbl">Key words</span><div class="sub" style="margin-top:6px">'+chips+'</div><button class="btn" data-act="quizstart" data-key="work">Quiz: Workplace conversations</button></section><aside class="side">'+detail(BYID[S.wterm])+'</aside></div>'}

function viewSpeak(){
  var shadow=SHADOW.map(function(s,i){return '<div class="shadow"><p>'+h(s)+'</p>'+say(s,0.9,"Listen")+say(s,0.55,"Slow")+'<button class="btn small'+(S.shadow[i]?'':' alt')+'" data-act="shadow" data-i="'+i+'" aria-pressed="'+(!!S.shadow[i])+'">'+(S.shadow[i]?'Said it':'I said it out loud')+'</button></div>'}).join("");
  var pr=PROMPTS[S.pi];
  var res="";
  if(S.result){var found=S.result.found,n=found.filter(Boolean).length;res='<div class="fb"><b>'+n+' of '+pr.keys.length+' key words used.</b><div class="keys">'+pr.keys.map(function(k,i){return '<span class="key'+(found[i]?' ok':'')+'">'+(found[i]?'✓ ':'')+h(k[0])+'</span>'}).join("")+'</div>'+(n>=pr.need?'<p>Good answer. Compare it with the model answer below.</p>':'<p>Add the missing words and try again.</p>')+'</div><span class="lbl">Model answer</span><p>'+h(pr.model)+'</p><div class="row" style="margin-top:8px">'+say(pr.model,0.9,"Listen to model answer")+'</div>'}
  return head("Speaking practice","Listen, then say each sentence out loud. This page cannot use your microphone, so you check your own pronunciation and type your longer answers to practice the words.")+
   '<div class="panel"><h2>Repeat after me</h2>'+shadow+'</div>'+
   '<div class="panel"><div class="sub" role="group" aria-label="Prompt">'+PROMPTS.map(function(p,i){return '<button class="pill" data-act="prompt" data-i="'+i+'" aria-pressed="'+(S.pi===i)+'">Prompt '+(i+1)+'</button>'}).join("")+'</div><h2>“'+h(pr.q)+'”</h2><p class="lead" style="margin-top:6px">Say your answer out loud first. Then type it here.</p>'+
   '<label class="lbl" for="ans">Your answer</label><textarea id="ans" placeholder="I check the...">'+h(S.ans)+'</textarea><div class="row" style="margin-block:10px"><button class="btn" data-act="check">Check my words</button></div>'+res+'</div>'}

var BICON=["airbrake","pretrip","vocab","dispatch","road","tire"];
function viewBadges(){
  var learned=count(P.learned);
  var prog={air:"Best: "+(P.best["zone-brakes"]!=null?P.best["zone-brakes"]+"%":"not taken"),pretrip:"Best: "+(P.best.pretrip!=null?P.best.pretrip+"%":"not taken"),vocab:learned+" of 30 terms",dispatch:"Best: "+(P.best.work!=null?P.best.work+"%":"not taken"),road:"Best: "+(P.best.road!=null?P.best.road+"%":"not taken"),tire:P.badges.tire?"Earned":"Not yet"};
  var g=BADGES.map(function(b){var on=!!P.badges[b.id];return '<div class="badge'+(on?' on':'')+'"><div class="seal">'+icon(on?"star":"badge")+'</div><div><h3>'+b.name+'</h3><p>'+b.how+'</p><p><b>'+(on?"Earned":prog[b.id])+'</b></p></div></div>'}).join("");
  return head("Your badges","Badges and progress stay on this device in this browser.")+'<div class="badges">'+g+'</div>'+
   '<div style="margin-top:24px">'+(S.confirm?'<p class="small" style="margin-bottom:8px">This clears learned terms, quiz scores, and badges on this device.</p><div class="row"><button class="btn warn" data-act="resetyes">Yes, reset progress</button><button class="btn alt" data-act="resetno">Keep my progress</button></div>':'<button class="btn alt small" data-act="reset">Reset my progress</button>')+'</div>'}

/* ---------- quiz engine ---------- */
function opts4(correct,pool){var o=shuffle(pool.filter(function(t){return t.id!==correct.id})).slice(0,3);o.push(correct);return shuffle(o)}
function blankEx(t){return h(t.ex).replace(new RegExp(t.en.replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&")+"s?","i"),"_____")}
function termQ(t,pool){
  var kinds=["def","listen","blank"];if(t.at)kinds.push("where");if(t.zone)kinds.push("zone");
  var k=kinds[Math.floor(Math.random()*kinds.length)];
  var base=pool.length>=4?pool:TERMS.filter(function(x){return x.lv===t.lv});
  if(k==="zone"){var zs=shuffle(ZONES.filter(function(z){return z.id!==t.zone})).slice(0,3),zc=ZONES.filter(function(z){return z.id===t.zone})[0];zs.push(zc);zs=shuffle(zs);
    return {html:'<h2>Is the <b>'+h(t.en)+'</b> part of which system?</h2>',opts:zs.map(function(z){return z.name}),ok:zs.indexOf(zc),why:t.en+": "+t.def}}
  var o=opts4(t,base),ok=o.indexOf(t),html;
  if(k==="def")html='<h2>Which term matches this meaning?</h2><p class="lead">'+h(t.def)+'</p>';
  else if(k==="listen")html='<h2>Listen. Which term do you hear?</h2><div class="row">'+say(t.en,0.8,"Play word")+say(t.en,0.5,"Slow")+'</div>';
  else if(k==="blank")html='<h2>Choose the missing word.</h2><p class="lead">'+blankEx(t)+'</p>';
  else html='<h2>What is the highlighted part?</h2><div class="panel" style="padding:8px">'+truck([t],t.id,false).replace(/<g class="tag">.*?<\/g>/,"")+'</div>';
  return {html:html,opts:o.map(function(x){return x.en}),ok:ok,why:t.en+": "+t.def}}
function buildQuiz(key){
  var qs=[],label="";
  if(key==="road"){label="Road test phrases";qs=shuffle(COMMANDS).slice(0,8).map(function(c){var o=shuffle([c[1],c[2],c[3],c[4]]);return {html:'<h2>The examiner says:</h2><p class="score" style="font-size:2.2rem;margin-block:6px">“'+h(c[0])+'”</p><div class="row">'+say(c[0],0.9,"Listen")+'</div><p class="lead" style="margin-top:10px">What does it mean?</p>',opts:o,ok:o.indexOf(c[1]),why:c[5]}})}
  else if(key==="work"){label="Workplace conversations";qs=shuffle(WORKQ).map(function(w){var o=shuffle([w[1]].concat(w[2]));return {html:'<h2>'+h(w[0])+'</h2>',opts:o,ok:o.indexOf(w[1]),why:w[3]}})}
  else{
    var pool,n;
    if(key==="l1"){pool=TERMS.filter(function(t){return t.lv===1});n=8;label="Basic trucking terms"}
    else if(key==="pretrip"){pool=TERMS.filter(function(t){return t.zone});n=8;label="Pre-trip final quiz"}
    else{var z=key.replace("zone-","");pool=TERMS.filter(function(t){return t.zone===z});n=Math.min(5,pool.length);label=ZONES.filter(function(x){return x.id===z})[0].name}
    var all=key==="l1"?pool:TERMS.filter(function(t){return t.zone||t.lv===2});
    qs=shuffle(pool).slice(0,n).map(function(t){return termQ(t,key==="l1"?pool:all)})}
  return {key:key,label:label,qs:qs,i:0,score:0,picked:null,done:false,earned:null}}
function viewQuiz(){
  var Q=S.quiz;
  if(Q.done){var pct=Math.round(Q.score/Q.qs.length*100);
    return '<div class="panel" style="max-width:560px"><span class="lbl">'+h(Q.label)+'</span><p class="score">'+Q.score+' / '+Q.qs.length+'</p><p class="lead" style="margin-top:8px">'+(pct>=80?"Excellent work. Keep going.":pct>=50?"Good start. Review the terms and try again.":"Review the terms, then try again. You can listen as many times as you like.")+'</p>'+(Q.earned?'<div class="fb"><b>Badge earned: '+Q.earned+'</b></div>':'')+'<div class="row"><button class="btn" data-act="quizstart" data-key="'+Q.key+'">Try again</button><button class="btn alt" data-act="quizexit">Back to lessons</button></div></div>'}
  var q=Q.qs[Q.i],p=Q.picked;
  return '<div class="panel q" style="max-width:640px"><div class="row" style="justify-content:space-between"><span class="lbl">'+h(Q.label)+' · Question '+(Q.i+1)+' of '+Q.qs.length+'</span><button class="btn alt small" data-act="quizexit">Exit</button></div><div class="bar" style="max-width:none;margin-top:8px"><i style="width:'+(Q.i/Q.qs.length*100)+'%"></i></div>'+q.html+
   '<div class="opts">'+q.opts.map(function(o,i){var c="opt";if(p!==null){if(i===q.ok)c+=" ok";else if(i===p)c+=" no"}return '<button class="'+c+'" data-act="ans" data-i="'+i+'"'+(p!==null?' disabled':'')+'><kbd>'+"ABCD"[i]+'</kbd><span>'+h(o)+'</span></button>'}).join("")+'</div>'+
   (p!==null?'<div class="fb"><b>'+(p===q.ok?"Correct.":"Not quite.")+'</b> '+h(q.why)+'</div><button class="btn" data-act="next">'+(Q.i+1===Q.qs.length?"See results":"Next question")+'</button>':'')+'</div>'}
function finishQuiz(){
  var Q=S.quiz,pct=Math.round(Q.score/Q.qs.length*100);Q.done=true;
  P.best[Q.key]=Math.max(P.best[Q.key]||0,pct);
  var map={"zone-brakes":"air",pretrip:"pretrip",work:"dispatch",road:"road"};
  if(map[Q.key]&&pct>=80)Q.earned=award(map[Q.key]);save()}

/* ---------- render ---------- */
var TABS=[["terms","Basic terms","Level 1"],["pre","Pre-trip","Level 2"],["road","Road test","Level 3"],["work","Workplace","Level 4"],["speak","Speaking","Level 5"],["badges","Badges",""]];
function render(){
  var a=document.activeElement,aid=a&&a.id,pos=a&&a.selectionStart;
  document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[2]?'<small>'+t[2]+'</small>':'<small>Progress</small>')+'</button>'}).join("");
  var learned=count(P.learned),pct=Math.round(learned/TERMS.length*100);
  document.getElementById("stats").innerHTML='<span><b>'+learned+'</b> of '+TERMS.length+' terms learned</span><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div><span><b>'+count(P.badges)+'</b> of '+BADGES.length+' badges</span>';
  var v;
  if(S.quiz)v=viewQuiz();
  else v=({terms:viewTerms,pre:viewPre,road:viewRoad,work:viewWork,speak:viewSpeak,badges:viewBadges})[S.tab]();
  document.getElementById("app").innerHTML=v;
  if(aid){var el=document.getElementById(aid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}
function go(tab){S.tab=tab;S.quiz=null;S.confirm=false;try{history.replaceState(null,"","#"+tab)}catch(e){}render();window.scrollTo(0,0)}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;var d=el.dataset;
  switch(d.act){
   case "tab":go(d.tab);return;
   case "say":speak(d.say,parseFloat(d.rate));return;
   case "pick":if(S.tab==="pre")S.pre=d.id;else S.sel=d.id;break;
   case "wpick":S.wterm=d.id;if(S.tab!=="work"){S.tab="work"}break;
   case "learned":if(P.learned[d.id])delete P.learned[d.id];else{P.learned[d.id]=1;if(count(P.learned)>=30)award("vocab")}save();break;
   case "mode":S.mode=d.mode;if(d.mode==="flash")initFlash();break;
   case "cat":S.cat=d.cat;break;
   case "deck":S.deck=d.deck;initFlash();break;
   case "flip":S.flash.flipped=true;break;
   case "again":S.flash.queue.push(S.flash.queue.shift());S.flash.flipped=false;break;
   case "know":var id=S.flash.queue.shift();P.learned[id]=1;S.flash.known++;S.flash.flipped=false;if(count(P.learned)>=30)award("vocab");save();break;
   case "zone":S.zone=d.zone;S.pre=null;break;
   case "gozone":S.zone=d.zone;S.pre=S.sel;S.tab="pre";break;
   case "dlg":S.dlg=+d.i;break;
   case "shadow":S.shadow[d.i]=!S.shadow[d.i];break;
   case "prompt":S.pi=+d.i;S.result=null;S.ans="";break;
   case "check":var txt=document.getElementById("ans").value;S.ans=txt;var pr=PROMPTS[S.pi];
     S.result={found:pr.keys.map(function(k){return new RegExp(k[1],"i").test(txt)})};
     if(pr.badge&&S.result.found.filter(Boolean).length>=pr.need)award(pr.badge);break;
   case "quizstart":S.quiz=buildQuiz(d.key);window.scrollTo(0,0);break;
   case "quizexit":S.quiz=null;break;
   case "ans":if(S.quiz.picked===null){var q=S.quiz.qs[S.quiz.i];S.quiz.picked=+d.i;if(+d.i===q.ok)S.quiz.score++}break;
   case "next":S.quiz.i++;S.quiz.picked=null;if(S.quiz.i>=S.quiz.qs.length){S.quiz.i=S.quiz.qs.length-1;finishQuiz()}break;
   case "reset":S.confirm=true;break;
   case "resetno":S.confirm=false;break;
   case "resetyes":P.learned={};P.best={};P.badges={};S.confirm=false;save();toast("Progress reset.");break;
  }
  render();
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('svg [data-act="pick"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){S.q=e.target.value;render()}
  else if(e.target.id==="ans"){S.ans=e.target.value}});
var sel=document.getElementById("lang");
sel.innerHTML=LANGS.map(function(l){return '<option value="'+l[0]+'">'+l[1]+'</option>'}).join("");sel.value=S.lang;
sel.addEventListener("change",function(){S.lang=sel.value;save();render()});
var hash=(location.hash||"").slice(1);if(["terms","pre","road","work","speak","badges"].indexOf(hash)>-1)S.tab=hash;
if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}
render();
})();
</script>

</body>
